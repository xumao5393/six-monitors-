name: snapshot

on:
  schedule:
    # 每 6 小时跑一次（UTC）；对应北京时间 08:17 / 14:17 / 20:17 / 02:17
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync to latest
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/snapshot.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitors/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh snapshot [skip ci]"
            git push || (git pull --rebase origin main || (git checkout --theirs monitors/data/*.json && git add monitors/data/*.json && git rebase --continue); git push)
          fi
