name: snapshot

on:
  schedule:
    - cron: '17 * * * *'  # 每小时跑一次（UTC）；对应北京时间每小时 17 分
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync to latest
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/snapshot.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add monitors/data/*.json
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "chore(data): refresh snapshot [skip ci]" || true
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt); discarding our commit and regenerating from latest main..."
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/snapshot.py
          done
          echo "push failed after 3 attempts"
          exit 1
