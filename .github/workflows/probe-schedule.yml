name: probe-schedule

on:
  schedule:
    - cron: '23 * * * *'  # 每小时 23 分，错开快照的 17 分
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "probe run at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "event: ${{ github.event_name }}"
