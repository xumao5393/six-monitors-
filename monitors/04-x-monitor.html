<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X监测（只读）</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang SC",sans-serif;background:#f6f7fb;color:#1a1d29}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0}.sub{color:#6b7280;font-size:13px}button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:20px;display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.card h3{margin:0 0 6px;font-size:13px;color:#6b7280}.big{font-size:26px;font-weight:800}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;background:#eef2ff;color:#3730a3}.badge.backup{background:#fef3c7;color:#92400e}.badge.cache{background:#fee2e2;color:#991b1b}
input{padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px}.note{font-size:12px;color:#6b7280}.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #f0f0f0;text-align:left}
</style></head><body>
<header><h1>𝕏 X监测（只读）</h1><span class="sub" id="updated">未刷新</span><span id="srcBadge" class="badge">未获取</span></header>
<main>
<div class="warn">只读监测：不登录、不发帖、不回复、不关注。输入任意<b>公开</b> X 账号（不预设任何账号），数据来自 FxTwitter / VxTwitter 公开接口。单帖浏览量公开接口常不提供，缺失时显示「未获取」，不编数。</div>
<div class="card"><input id="handle" placeholder="输入公开账号，如 nasa" style="width:260px"> <button onclick="refreshAll()">🔄 刷新</button></div>
<div class="grid" id="kpis"></div>
<div class="card"><h3>热搜（美国，trends24 公开榜）</h3><ol id="trends"><li>未获取</li></ol></div>
<div class="card"><h3>帖子明细</h3><table><thead><tr><th>时间</th><th>内容</th><th>点赞</th><th>回复</th><th>转发</th></tr></thead><tbody id="posts"><tr><td colspan="5">未获取 — 公开接口未返回时间线时显示此状态</td></tr></tbody></table></div>
<div class="card"><h3>数据源状态</h3><div id="sources"></div></div>
</main>
<script>
async function fetchTO(u,ms=8000){const c=new AbortController();setTimeout(()=>c.abort(),ms);const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return r.json();}
function setKPIs(p){
 document.getElementById('kpis').innerHTML=[
  ['粉丝',p?.followers??'—'],['关注',p?.following??'—'],['帖子',p?.tweets??'—'],['总获赞',p?.likes??'—']
 ].map(([k,v])=>`<div class="card"><h3>${k}</h3><div class="big">${v}</div></div>`).join('');
}
async function refreshAll(){
 const h=document.getElementById('handle').value.trim().replace(/^@/,'');
 if(!h){alert('请先输入公开账号');return;}
 const src=[];let profile=null,role='missing';
 for(const [name,base] of [['FxTwitter','https://api.fxtwitter.com/'],['VxTwitter','https://api.vxtwitter.com/']]){
   try{const d=await fetchTO(base+encodeURIComponent(h));
     const u=d.user||d;if(u&&u.followers!==undefined){profile={followers:u.followers,following:u.following,tweets:u.tweets??u.statuses_count,likes:u.likes??'—'};role=name==='FxTwitter'?'primary':'backup';src.push([name,role==='primary'?'主源':'替补','正常',new Date().toLocaleString('zh-CN')]);break;}
     else throw new Error('no user');
   }catch(e){src.push([name,name==='FxTwitter'?'主源':'替补','失败','—']);}
 }
 setKPIs(profile);
 const b=document.getElementById('srcBadge');b.textContent=profile?(role==='primary'?'主源 · FxTwitter':'替补源 · VxTwitter'):'未获取';b.className='badge '+(role==='primary'?'':role==='backup'?'backup':'cache');
 document.getElementById('updated').textContent='更新：'+new Date().toLocaleString('zh-CN');
 document.getElementById('sources').innerHTML=src.map(s=>`<div>${s[0]} — <span class="badge ${s[1]==='主源'?'':s[1]==='替补'?'backup':'cache'}">${s[1]}</span> ${s[2]} · ${s[3]}</div>`).join('')+'<p class="note">热搜：trends24 公开榜在浏览器常被 CORS 拦截，拦截时显示未获取，不编榜单。</p>';
 try{const t=await fetchTO('https://trends24.in/united-states/');document.getElementById('trends').innerHTML='<li>trends24 页面为 HTML 榜单，需人工打开核对，本页不解析其 HTML。</li>';}catch(e){document.getElementById('trends').innerHTML='<li>未获取（CORS / 网络）— 请打开 trends24.in 核对</li>';}
}
</script></body></html>
